name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

# Actions are pinned to commits, and no job can write to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The tests that need Postgres create their databases on
      # GALLEON_TEST_POSTGRES (testkit.PostgresEnv), and the ones that need
      # a streaming replica use GALLEON_TEST_POSTGRES_REPLICA
      # (testkit.ReplicaEnv), a standby of it. With CI set, they fail
      # rather than skip when either is missing. The "Start Postgres" step
      # runs both.
      GALLEON_TEST_POSTGRES: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
      GALLEON_TEST_POSTGRES_REPLICA: postgres://postgres:postgres@localhost:5433/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.work
      # A service container can't be a standby of another, so both run
      # here, on the host's network.
      - name: Start Postgres, with a streaming replica
        run: .github/scripts/postgres-replica.sh
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet and test every workspace module
        run: |
          for dir in $(go list -m -f '{{.Dir}}'); do
            echo "::group::$dir"
            (cd "$dir" && go vet ./... && go test -race ./...)
            echo "::endgroup::"
          done
      - name: Postgres logs
        if: failure()
        run: |
          docker logs galleon-pg-primary || true
          docker logs galleon-pg-standby || true

  adr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Test the ADR check
        run: .github/scripts/adr-check-test.sh
      # Records accepted before this change must be unchanged except for
      # their Status: line, and nothing merges while still Proposed. On a
      # pull request, HEAD is GitHub's merge of the branch into its target,
      # so its first parent is the target as the merge saw it. On a push,
      # the base is the commit before the push, fetched if a force push
      # left it out of the clone; a push that created the branch has none.
      - name: Check the ADRs
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base=""
          if [ "$EVENT" = pull_request ]; then
            base=$(git rev-parse HEAD^1)
          elif [ -n "$PUSH_BEFORE" ] && ! [[ "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base=$PUSH_BEFORE
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$base" || {
                echo "::error::the commit before this push ($base) can't be fetched, so accepted ADRs can't be checked for edits"
                exit 1
              }
            fi
          fi
          .github/scripts/adr-check.sh --decided $base

  # The docs site (site/). Its Go samples are a workspace module, so the
  # test job above compiles and tests them.
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
      # Bun installs and runs the scripts; Next.js itself runs on Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Test the site's scripts
        run: bun test
      - name: Typecheck
        run: bun run typecheck
      # Also fails if a page's code sample is out of date with its Go file.
      - name: Build
        run: bun run build

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Galleon architecture, top to bottom</text>

  <!-- App -->
  <rect x="30" y="56" width="760" height="62" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="46" y="80" font-size="15" font-weight="700" fill="#312e81">Your application</text>
  <text x="46" y="102" font-size="13" fill="#1f2937">Modules: operations (Themis or Go), domain code, ORM models, templates</text>

  <!-- Batteries -->
  <rect x="30" y="128" width="760" height="62" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="46" y="152" font-size="15" font-weight="700" fill="#065f46">Batteries (first-party, optional)</text>
  <text x="46" y="174" font-size="13" fill="#1f2937">web (templ + htmx + Vite) · realtime · jobs · http3 · admin (later)</text>

  <!-- Adapters -->
  <rect x="30" y="200" width="760" height="62" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="46" y="224" font-size="15" font-weight="700" fill="#9a3412">Adapters (separate modules: one seam ⟷ one tool)</text>
  <text x="46" y="246" font-size="13" fill="#1f2937">dpg · ORM · vantage · comms · billing · goose · OIDC · Redis · NATS · etcd</text>

  <!-- Planes -->
  <g font-size="12" fill="#1f2937">
    <rect x="30" y="272" width="144" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="102" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Transport</text>
    <text x="44" y="322">HTTP/1.1, 2, 3</text><text x="44" y="342">gRPC · Connect</text><text x="44" y="362">WebSocket · SSE</text><text x="44" y="382">Raw listeners</text><text x="44" y="402">Outbound client</text>

    <rect x="184" y="272" width="144" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="256" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Operation</text>
    <text x="198" y="322">Descriptors</text><text x="198" y="342">12-stage pipeline</text><text x="198" y="362">Decode · encode</text><text x="198" y="382">Validate</text><text x="198" y="402">Error model</text>

    <rect x="338" y="272" width="144" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="410" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Data</text>
    <text x="352" y="322">Sources · replicas</text><text x="352" y="342">Read/write tx</text><text x="352" y="362">Consistency</text><text x="352" y="382">Migrations seam</text><text x="352" y="402">Cache · storage</text>

    <rect x="492" y="272" width="144" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="564" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Security</text>
    <text x="506" y="322">Identity</text><text x="506" y="342">Context (CBAC)</text><text x="506" y="362">Decisions</text><text x="506" y="382">Sessions</text><text x="506" y="402">Keyring</text>

    <rect x="646" y="272" width="144" height="168" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="718" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="#075985">Async · realtime</text>
    <text x="660" y="322">Jobs</text><text x="660" y="342">Scheduler</text><text x="660" y="362">Events · consumers</text><text x="660" y="382">Channels</text><text x="660" y="402">Presence</text>
  </g>
  <text x="410" y="458" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">The five runtime planes. Each defines its seams and ships a correct default.</text>

  <!-- Integration kit -->
  <rect x="30" y="470" width="760" height="56" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="46" y="493" font-size="15" font-weight="700" fill="#701a75">Integration kit</text>
  <text x="46" y="514" font-size="13" fill="#1f2937">Outbox · inbox · CloudEvents · typed clients · webhooks · synced caches</text>

  <!-- Kernel -->
  <rect x="30" y="536" width="760" height="70" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="2"/>
  <text x="46" y="560" font-size="15" font-weight="700" fill="#111827">Kernel</text>
  <text x="46" y="580" font-size="13" fill="#1f2937">App · modules · lifecycle · process model · config · DI · clock</text>
  <text x="46" y="598" font-size="13" fill="#1f2937">Coordination interface (explicit backend, no default) · OpenTelemetry + slog</text>

  <!-- Foundation -->
  <rect x="30" y="616" width="760" height="50" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="46" y="638" font-size="15" font-weight="700" fill="#374151">Foundation</text>
  <text x="46" y="656" font-size="13" fill="#1f2937">Go stdlib (net/http, context, slog, embed) · OpenTelemetry</text>

  <!-- Tooling sidebar -->
  <rect x="806" y="56" width="124" height="610" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="868" y="82" text-anchor="middle" font-size="15" font-weight="700" fill="#854d0e">Tooling</text>
  <g font-size="12" fill="#1f2937" text-anchor="middle">
    <text x="868" y="112">galleon CLI</text><text x="868" y="136">Dev server</text><text x="868" y="160">Analyzers</text><text x="868" y="184">App manifest</text><text x="868" y="208">MCP server</text><text x="868" y="232">Test kit</text><text x="868" y="256">Fakes</text><text x="868" y="280">Cluster harness</text><text x="868" y="304">Conformance</text><text x="868" y="324">suites</text>
  </g>
  <text x="868" y="640" text-anchor="middle" font-size="11" fill="#713f12">beside every layer</text>
</svg>
